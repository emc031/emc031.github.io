<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Career Prism</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #f5f2ed;
      --ink: #1a1a18;
      --ink-muted: #5a5750;
      --accent: #b5451b;
      --border: #ddd9d2;
      --max-w: 900px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      line-height: 1.7;
      padding: 3rem 2rem;
    }

    .container { max-width: var(--max-w); margin: 0 auto; }

    h1 {
      font-family: 'Lora', serif;
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 2rem;
    }

    .field { margin-bottom: 1.25rem; }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 0.4rem;
    }

    textarea, input[type="password"] {
      width: 100%;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.65rem 0.85rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      color: var(--ink);
      resize: vertical;
    }

    textarea:focus, input[type="password"]:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.65rem 1.5rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    button:hover { background: #8f3614; }
    button:disabled { background: var(--ink-muted); cursor: not-allowed; }

    .responses {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5rem;
      margin-top: 2.5rem;
    }

    .response-box {
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      border: 1.5px solid transparent;
      display: flex;
      flex-direction: column;
      transition: opacity 0.28s ease;
    }

    .response-box-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.75rem;
    }

    .response-box h2 {
      font-family: 'Lora', serif;
      font-size: 1rem;
      font-weight: 600;
    }

    .score-badge {
      font-family: 'Lora', serif;
      font-size: 1.05rem;
      font-weight: 600;
      flex-shrink: 0;
      margin-left: 0.5rem;
    }

    .response-text {
      font-size: 0.92rem;
      line-height: 1.7;
      transition: opacity 0.22s ease;
    }

    .response-box p { margin-bottom: 0.75rem; }
    .response-box p:last-child { margin-bottom: 0; }
    .response-box ul, .response-box ol { padding-left: 1.25rem; margin-bottom: 0.75rem; }
    .response-box li { margin-bottom: 0.25rem; }
    .response-box strong { font-weight: 500; }

    .response-box-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 0.75rem;
    }

    .what-is-link {
      font-size: 0.85rem;
      color: var(--ink-muted);
      text-decoration: underline;
      line-height: 1;
    }
    .what-is-link:hover { color: var(--ink); }

    .read-more-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      padding: 0;
      margin-top: 0;
      line-height: 1;
      text-decoration: underline;
    }
    .read-more-btn:hover { background: none; color: #8f3614; }

    @media (max-width: 600px) {
      .responses { grid-template-columns: 1fr; }
    }
    .responses.has-expanded { grid-template-columns: 1fr; }
    .responses.has-expanded .response-box.expanded {
      max-width: 680px;
      margin: 0 auto;
      width: 100%;
    }

    .loading { color: var(--ink-muted); font-style: italic; }
    .error { color: #b5241b; font-size: 0.88rem; margin-top: 0.5rem; }

    .screen { display: none; }
    .screen.active { display: block; }

    #gate {
      max-width: 360px;
      margin: 8rem auto;
      text-align: center;
    }

    #gate h1 { margin-bottom: 1.5rem; }

    #gate input[type="password"] {
      margin-bottom: 0.75rem;
      text-align: center;
    }

    #gate button { width: 100%; }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .app-header h1 { margin-bottom: 0; }

    #feedback-btn {
      background: transparent;
      color: #2a7a2a;
      border: 1.5px solid #2a7a2a;
      border-radius: 6px;
      padding: 0.45rem 1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
      margin-left: 1rem;
    }
    #feedback-btn:hover { background: #eaf4ea; }

    .powered-by {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--ink-muted);
    }

    .powered-by img { height: 56px; opacity: 0.55; }
    .powered-by a { color: inherit; text-decoration: underline; }
    .powered-by a:hover { color: var(--ink); }
  </style>
</head>
<body>
<div id="gate" class="screen active">
  <h1>password pls</h1>
  <div class="field">
    <input type="password" id="password-input" placeholder="Password…" onkeydown="if(event.key==='Enter'){event.preventDefault();submitPassword();}" />
  </div>
  <button onclick="submitPassword()">Enter</button>
  <div class="error" id="gate-error"></div>
</div>

<div id="app" class="container screen">
  <div class="app-header">
    <h1>Is this job good for the world?</h1>
    <a id="feedback-btn" href="#" target="_blank" rel="noopener" style="display:none">Give Feedback</a>
  </div>

  <div class="field">
    <label for="job-input">Job description</label>
    <textarea id="job-input" rows="6" placeholder="Paste a job ad URL or job description here..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();runDialogue();}"></textarea>
  </div>

  <button id="submit-btn" onclick="runDialogue()">Ask the archetypes</button>
  <div class="error" id="error-msg"></div>

  <div class="responses" id="responses"></div>

  <div class="powered-by">
    <img src="../inta.svg" alt="" />
    powered by <a id="inta-link" href="#" target="_blank" rel="noopener">integral altruism</a>
  </div>
</div>

<script>
  function scoreColor(score) {
    if (score > 0) return '#2a7a2a';
    if (score < 0) return '#c0392b';
    return '#5a5750';
  }

  function scoreBadgeHtml(score) {
    if (score == null) return '';
    const label = (score > 0 ? '+' : '') + score + '/10';
    return `<span class="score-badge" style="color:${scoreColor(score)}">${label}</span>`;
  }

  let archetypes = [];

  const IS_LOCAL = window.location.hostname === "localhost" || window.location.protocol === "file:";
  const BACKEND_URL = IS_LOCAL ? "http://localhost:5000" : "https://emc031githubio-production.up.railway.app";

  fetch(`${BACKEND_URL}/api/config`)
    .then(r => r.json())
    .then(cfg => {
      const btn = document.getElementById("feedback-btn");
      btn.href = cfg.feedback_form;
      btn.style.display = "";
      document.getElementById("inta-link").href = cfg.inta_website;
    })
    .catch(() => {});

  let sessionPassword = "";

  if (IS_LOCAL) {
    document.getElementById("gate").classList.remove("active");
    document.getElementById("app").classList.add("active");
  }
  const _animating = new Set();

  function typeText(idx, text, speed = 10) {
    _animating.add(idx);
    const el = document.getElementById("text-" + idx);
    let i = 0;
    el.textContent = "▋";
    function tick() {
      if (!_animating.has(idx)) return;
      i++;
      if (i < text.length) {
        el.textContent = text.slice(0, i) + "▋";
        setTimeout(tick, speed);
      } else {
        _animating.delete(idx);
        el.innerHTML = marked.parse(text);
      }
    }
    setTimeout(tick, speed);
  }

  async function submitPassword() {
    const input = document.getElementById("password-input");
    const errorEl = document.getElementById("gate-error");
    errorEl.textContent = "";

    const res = await fetch(`${BACKEND_URL}/api/auth`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: input.value }),
    }).catch(() => null);

    if (!res || !res.ok) {
      errorEl.textContent = "Incorrect password.";
      input.value = "";
      return;
    }

    sessionPassword = input.value;
    document.getElementById("gate").classList.remove("active");
    document.getElementById("app").classList.add("active");
  }

  async function runDialogue() {
    const job = document.getElementById("job-input").value.trim();
    const errorEl = document.getElementById("error-msg");
    const btn = document.getElementById("submit-btn");
    const responsesEl = document.getElementById("responses");

    errorEl.textContent = "";
    if (!job) { errorEl.textContent = "Please enter a job description."; return; }

    responsesEl.innerHTML = "<p class='loading'>Asking the archetypes…</p>";
    btn.disabled = true;

    try {
      const res = await fetch(`${BACKEND_URL}/api/dialogue`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ job, password: sessionPassword }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || `Server error ${res.status}`);
      }

      archetypes = await res.json();

      responsesEl.innerHTML = archetypes.map((a, i) => `
        <div class="response-box" id="box-${i}" style="background:${a.bg}; border-color:${a.border}">
          <div class="response-box-header">
            <h2>${a.name}</h2>
            ${scoreBadgeHtml(a.score)}
          </div>
          ${a.error
            ? `<div class="response-text">Error: ${a.error}</div>`
            : `<div class="response-text" id="text-${i}"></div>
               <div class="response-box-footer">
                 <button class="read-more-btn" onclick="expand(${i})" id="btn-${i}">Read more</button>
                 ${a.intro ? `<a class="what-is-link" href="${a.intro}" target="_blank">${a.intro_label || "What is a " + a.name + "?"}</a>` : ""}
               </div>`
          }
        </div>
      `).join("");

      archetypes.forEach((a, i) => {
        if (!a.error) setTimeout(() => typeText(i, a.summary), i * 120);
      });
    } catch (err) {
      errorEl.textContent = "Error: " + err.message;
      responsesEl.innerHTML = "";
    }

    btn.disabled = false;
  }

  function expand(i) {
    _animating.delete(i);
    const a = archetypes[i];
    const responsesEl = document.getElementById("responses");
    const allBoxes = [...responsesEl.querySelectorAll(".response-box")];
    const textEl = document.getElementById("text-" + i);
    const btn = document.getElementById("btn-" + i);

    // Fade out other boxes and current text
    allBoxes.forEach((box, idx) => { if (idx !== i) box.style.opacity = "0"; });
    textEl.style.opacity = "0";

    setTimeout(() => {
      // Hide other boxes and switch to 1-col layout
      allBoxes.forEach((box, idx) => { if (idx !== i) box.style.display = "none"; });
      responsesEl.classList.add("has-expanded");
      document.getElementById("box-" + i).classList.add("expanded");
      // Swap text and fade in
      textEl.innerHTML = marked.parse(a.full);
      requestAnimationFrame(() => requestAnimationFrame(() => textEl.style.opacity = ""));
    }, 280);

    btn.textContent = "Read less";
    btn.setAttribute("onclick", `collapse(${i})`);
  }

  function collapse(i) {
    const a = archetypes[i];
    const responsesEl = document.getElementById("responses");
    const allBoxes = [...responsesEl.querySelectorAll(".response-box")];
    const textEl = document.getElementById("text-" + i);
    const btn = document.getElementById("btn-" + i);

    // Fade out text
    textEl.style.opacity = "0";

    setTimeout(() => {
      // Show other boxes at opacity 0, restore layout
      allBoxes.forEach((box, idx) => {
        if (idx !== i) { box.style.display = ""; box.style.opacity = "0"; }
      });
      responsesEl.classList.remove("has-expanded");
      document.getElementById("box-" + i).classList.remove("expanded");
      // Swap text and fade everything in
      textEl.innerHTML = marked.parse(a.summary);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        textEl.style.opacity = "";
        allBoxes.forEach((box, idx) => { if (idx !== i) box.style.opacity = ""; });
      }));
    }, 250);

    btn.textContent = "Read more";
    btn.setAttribute("onclick", `expand(${i})`);
  }
</script>
</body>
</html>
